<!-- ✨ ASP-POYA splash: هەر جارا ئەپ ڤەدبیت (HTML — بەری Flutter ئامادە ببیت) -->
<style>
@font-face{font-family:AspSplash;src:url(splash/aspfont.woff) format('woff');font-weight:900;font-display:block}
#asp-splash{position:fixed;inset:0;z-index:2147483000;background:radial-gradient(ellipse at 50% 55%,#2a0a0e 0%,#0d0507 48%,#030203 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .55s ease,transform .55s ease;-webkit-user-select:none;user-select:none}
#asp-splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#asp-splash .t{font-family:AspSplash,'Arial Black',Arial,sans-serif;font-weight:900;font-size:min(13.5vw,64px);letter-spacing:.02em;display:flex;direction:ltr;margin-bottom:6px;filter:drop-shadow(0 0 14px rgba(230,20,32,.55)) drop-shadow(0 3px 2px #000)}
#asp-splash .t span{display:inline-block;background:linear-gradient(180deg,#fff 0%,#e9ecf2 30%,#9aa0aa 52%,#f4f6fa 70%,#b9bec7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transform:translateY(18px) scale(.6);animation:sp-l .5s cubic-bezier(.2,1.6,.4,1) forwards}
#asp-splash .bar{width:0;height:5px;border-radius:3px;background:#e6202c;box-shadow:0 0 12px #ff2a36;margin-bottom:min(7vh,46px);animation:sp-bar .5s ease-out 1.75s forwards}
#asp-splash .st{position:relative;width:min(90vw,50vh,440px);aspect-ratio:1}
#asp-splash .st img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#asp-splash .ring{opacity:0;transform:scale(.55) rotate(-40deg);animation:sp-ring .8s cubic-bezier(.2,1.3,.4,1) .05s forwards}
#asp-splash .gleam{position:absolute;inset:0;border-radius:50%;opacity:0;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.0) 74%,rgba(255,255,255,.95) 80%,rgba(255,255,255,0) 86%,transparent 100%);-webkit-mask:radial-gradient(circle,transparent 0 40.6%,#000 41.2% 43.8%,transparent 44.4%);mask:radial-gradient(circle,transparent 0 40.6%,#000 41.2% 43.8%,transparent 44.4%);animation:sp-gleam 1.5s ease-in-out .55s 2 forwards}
#asp-splash .duo{clip-path:circle(41% at 50% 50%);-webkit-clip-path:circle(41% at 50% 50%);transform:translateY(42%);opacity:0;animation:sp-duo .9s cubic-bezier(.2,1.1,.3,1) .55s forwards}
#asp-splash .sw{top:69%!important;bottom:auto!important;height:auto!important;-webkit-clip-path:inset(0 100% 0 0);clip-path:inset(0 100% 0 0);animation:sp-sw .55s ease-out 1.85s forwards}
@keyframes sp-l{to{opacity:1;transform:none}}
@keyframes sp-bar{to{width:min(42vw,200px)}}
@keyframes sp-ring{to{opacity:1;transform:none}}
@keyframes sp-gleam{0%{opacity:0;transform:rotate(-30deg)}20%{opacity:1}100%{opacity:0;transform:rotate(330deg)}}
@keyframes sp-duo{to{transform:none;opacity:1}}
@keyframes sp-sw{to{-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0)}}
</style>
<div id="asp-splash" aria-hidden="true">
  <div class="t"><span style="animation-delay:1.0s">A</span><span style="animation-delay:1.08s">S</span><span style="animation-delay:1.16s">P</span><span style="animation-delay:1.24s">-</span><span style="animation-delay:1.32s">P</span><span style="animation-delay:1.4s">O</span><span style="animation-delay:1.48s">Y</span><span style="animation-delay:1.56s">A</span></div>
  <div class="bar"></div>
  <div class="st">
    <img class="ring" src="splash/ring.webp" alt="">
    <div class="gleam"></div>
    <img class="duo" src="splash/duo.webp" alt="">
    <img class="sw" src="splash/swoosh.webp" alt="">
  </div>
</div>
<script>
(function(){
  var el=document.getElementById('asp-splash');if(!el)return;
  if(window.__aspOAuthDone){el.remove();return;}
  var TPL=el.outerHTML; // بۆ نیشاندانا دووبارە پشتی زڤڕینێ ژ پشتێ
  var t0=Date.now(),MIN=2900,ready=false,gone=false;
  function soundsOn(){try{return localStorage.getItem('flutter.set_sounds')!=='false';}catch(e){return true;}}

  // 🎵 دەنگ ب Web Audio: پشتی ئێکەم دەستلێدانێ «ڤەدبیت» و پاشان دشێت ب خۆ لێبدەت
  var AC=window.AudioContext||window.webkitAudioContext, ctx=null, buf=null;
  try{ if(AC){ ctx=new AC(); fetch('splash/intro.mp3').then(function(r){return r.arrayBuffer();}).then(function(b){
        return new Promise(function(res,rej){ctx.decodeAudioData(b,res,rej);});}).then(function(d){buf=d;}).catch(function(){}); } }catch(e){ctx=null;}
  function viaTag(){try{var a=new Audio('splash/intro.mp3');a.volume=.75;var p=a.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
  function play(){
    if(!soundsOn())return;
    if(ctx&&buf){
      var go=function(){try{var s=ctx.createBufferSource(),g=ctx.createGain();g.gain.value=.75;s.buffer=buf;s.connect(g);g.connect(ctx.destination);s.start(0);}catch(e){viaTag();}};
      if(ctx.state==='running')go(); else ctx.resume().then(function(){ctx.state==='running'?go():viaTag();}).catch(viaTag);
    } else viaTag();
  }
  // ئێکەم دەستلێدان ل هەر جهەکێ ئەپێ ➔ دەنگ ڤەدبیت (iPhone)
  var unlocked=false;
  function unlock(){ if(unlocked||!ctx)return; unlocked=true;
    try{ctx.resume();var s=ctx.createBufferSource();s.buffer=ctx.createBuffer(1,1,22050);s.connect(ctx.destination);s.start(0);}catch(e){} }
  ['pointerdown','touchend','keydown'].forEach(function(t){window.addEventListener(t,unlock,{capture:true,passive:true});});

  function attach(node){
    try{document.documentElement.appendChild(node);}catch(e){}
  }
  attach(el);
  try{new MutationObserver(function(){if(!gone&&!el.isConnected){document.documentElement.appendChild(el);}}).observe(document.documentElement,{childList:true});}catch(e){}
  function hide(){if(gone)return;gone=true;el.classList.add('out');setTimeout(function(){el.remove();},600);}
  function check(){if(ready&&Date.now()-t0>=MIN)hide();else if(ready)setTimeout(hide,MIN-(Date.now()-t0));}
  window.addEventListener('flutter-first-frame',function(){ready=true;check();});
  setTimeout(function(){ready=true;check();},14000);

  // ئێکەم جار: دەنگ (ئەگەر iPhone رێ نەدا، ب ئێکەم دەستلێدانێ د ناڤ شاشا دەستپێکێ دا)
  setTimeout(function(){
    play();
    el.addEventListener('pointerdown',function(){ if(!gone) play(); },{once:true});
  },60);

  // 🔁 زڤڕین بۆ ئەپێ پشتی ٣٠+ چرکان ➔ شاشا دەستپێکێ و ئاواز دیسا
  var hiddenAt=0;
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden'){hiddenAt=Date.now();return;}
    if(!hiddenAt||Date.now()-hiddenAt<30000||!gone)return;
    hiddenAt=0;
    var w=document.createElement('div');w.innerHTML=TPL;el=w.firstChild;gone=false;t0=Date.now();
    attach(el);
    play();
    setTimeout(hide,2600);
  });
})();
</script>
