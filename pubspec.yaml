name: zimanpro
description: ASP - فێربوونا ئەلمانی و ئینگلیزی ب کوردی بادینی.
publish_to: 'none'
version: 2.22.0+222

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # تۆمارکرنا دەنگی ژ مایکرۆفۆنێ
  record: ^6.0.0
  # لێدانا فایلێن دەنگی
  audioplayers: ^6.1.0
  # پاشەکەفتکرنا دەنگان (IndexedDB ل iPhone/وێبێ، فایل ل Android)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Web Audio بۆ iPhone (Safari)
  web: ^1.1.0
  # پاشەکەفتکرنا XP، Streak و پێشکەفتنێ
  shared_preferences: ^2.3.2
  # دەنگێ ئۆتۆماتیک بۆ ئەلمانی و ئینگلیزی (ئەگەر تە دەنگ تۆمار نەکربیت)
  flutter_tts: ^4.2.0
  # پەیوەندی ب سێرڤەرێ کلۆنکرنا دەنگی (voice_lab/server.py)
  http: ^1.2.2
  # هنارتنا نموونەیا دەنگێ تە (بۆ Colab / Telegram / ...)
  share_plus: ^10.1.0
  # هەلبژارتنا voice_pack.zip ژ مۆبایلێ (بێ پێدڤی ب کۆمپیوتەری)
  file_picker: ^8.1.2
  # ڤەکرنا zip
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/curriculum.json
    # ئەزموون: وانە، A1، تاقیکرنا ئاستی
    - assets/exams.json
    # لۆگۆیا ASP
    - assets/brand/
    - assets/mascot/
    # دەنگێ AI (Piper / MMS) — ب GitHub Actions دهێتە دروستکرن
    - assets/tts/de/
    - assets/tts/en/
    - assets/tts/ku/
    - assets/tts/de_f/
    - assets/tts/en_m/
    # پەرتووکا رێزمانێ «A1.1 mit Poya» (ژ book/A1_mit_Poya.md)
    - assets/book.json
    - assets/a1_summary.json
    - assets/grammar.json
    - assets/grammar_en.json
    - assets/kommunikation.json
    - assets/goethe.json
    # 📝 رستەیێن جهێ ڤالا (زێدە) بۆ هەر قۆناغەکێ
    - assets/cloze.json
    # 🖼️ وێنەیێن 3D: پەیڤ، دینار، ئاگر/قەشا
    - assets/img/vocab/
    - assets/img/fx/
    # دەنگێن یاریێ (دروست، خەلەت، تەمام ...)
    - assets/sfx/
    # پاکێتا دەنگێ کلۆنکری ژ Colab (ku_g1.mp3, de_g1.mp3, en_g1.mp3 ...)
    - assets/voices/

  # فۆنتێن بادینی
  fonts:
    # فۆنتێ ئەلمانی و ئینگلیزی: Roboto (ä ö ü ß) — پیتێن کوردی ژ Shasenem دهێن
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
    - family: Shasenem
      fonts:
        - asset: assets/fonts/Shasenem.ttf
    - family: Sarchia
      fonts:
        - asset: assets/fonts/Sarchia.ttf
