# 🔊 دروستکرنا دەنگێ AI بۆ هەمی وانەیان (ئەلمانی، ئینگلیزی، بادینی)
# دەمێ ناڤەرۆک دگوهۆڕیت ب خۆ کار دکەت، و فایلێن نوو دکەتە د assets/tts/ دا.
name: AI Voices

on:
  push:
    branches: [main]
    paths:
      - assets/curriculum.json
      - assets/exams.json
      - assets/book.json
      - voice_lab/make_ai_voices.py
      - .github/workflows/voices.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: voices
  cancel-in-progress: false

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q piper-tts soundfile numpy
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch
          pip install -q transformers

      - name: Generate German + English (Piper)
        env:
          LANGS: de,en
        run: python voice_lab/make_ai_voices.py .

      - name: Generate Badini (MMS)
        continue-on-error: true
        env:
          LANGS: ku
        run: python voice_lab/make_ai_voices.py .

      - name: Commit voices
        id: commit
        run: |
          git config user.name "ASP Voice Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/tts
          if git diff --cached --quiet; then echo "changed=false" >> $GITHUB_OUTPUT; exit 0; fi
          git commit -q -m "🔊 AI voices: $(git diff --cached --name-only | wc -l) files"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "changed=true" >> $GITHUB_OUTPUT

      # پوش ب GITHUB_TOKEN ب خۆ build ـێ دەستپێناکەت؛ لەوما ب دەستی دەستپێدکەین
      - name: Rebuild app
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build_apk.yml --ref main
