name: Auth probe
on:
  push:
    paths: [.github/workflows/auth_probe.yml, .github/scripts/auth_probe.py, .github/scripts/count_learners.py]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          echo "dns A: $(dig +short asp-poya.com A | tr '\n' ' ')" | tee -a probe.log
          echo "dns www: $(dig +short www.asp-poya.com | tr '\n' ' ')" | tee -a probe.log
      - run: pip install -q requests && python .github/scripts/count_learners.py | tee -a probe.log
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - run: python .github/scripts/auth_probe.py | tee -a probe.log
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - if: always()
        run: python3 -c "import sys;[print('::notice title=probe::'+l.strip()) for l in open('probe.log')]"
