# دروستکرنا APK ب بێ کۆمپیوتەر — GitHub ب بێ پارە ئەپی بۆ تە build دکەت.
# ئەنجام: Actions ➔ دویماهیک run ➔ Artifacts ➔ ZimanPro-apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android platform
        run: flutter create . --platforms=android --project-name zimanpro --org com.zimanpro 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # flutter create تاقیکرنەکا نموونە (MyApp) زێدە دکەت کو د ئەپێ مە دا نینە
      - name: Patch Android config
        run: |
          rm -f test/widget_test.dart
          python3 .github/scripts/patch_android.py

      - name: Get packages
        run: flutter pub get 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Build release APK
        run: flutter build apk --release 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # خەلەتیان وەکی annotation نیشان ددەت دا Claude بشێت بخوینیت
      # 📸 وێنەیێن کاریکاتێران بۆ پشکنینێ (branch: ci-shots)
      - name: Mascot screenshots
        continue-on-error: true
        timeout-minutes: 8
        run: |
          pip install -q playwright || echo "::error::shots: pip"
          python3 -m playwright install --with-deps chromium > /tmp/pw.log 2>&1 || { echo "::error::shots: install $(tail -c 300 /tmp/pw.log | tr '\n' ' ')"; }
          nohup python3 -m http.server 8080 --bind 127.0.0.1 --directory build/web > /tmp/http.log 2>&1 &
          for k in $(seq 1 20); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/ >/dev/null || echo "::error::shots: http $(tail -c 200 /tmp/http.log)"
          python3 .github/scripts/shots.py > /tmp/sh.log 2>&1 || echo "::error::shots: run $(tail -c 400 /tmp/sh.log | tr '\n' ' ')"
          cd /tmp/shots && git init -q && git checkout -q -b ci-shots && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "shots ${GITHUB_SHA::7}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots > /tmp/push.log 2>&1 \
            || echo "::error::shots: push $(tail -c 300 /tmp/push.log | tr '\n' ' ')"

      - name: Report errors
        if: failure()
        run: python3 .github/scripts/report_errors.py build.log

      - uses: actions/upload-artifact@v4
        with:
          name: ZimanPro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # 🍏 iPhone: ئەپا وێبێ ل سەر GitHub Pages ➔ https://asp-kurd.github.io
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create web platform
        run: |
          flutter create . --platforms=web --project-name zimanpro --org com.zimanpro 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Patch web config
        run: |
          rm -f test/widget_test.dart
          python3 .github/scripts/patch_web.py

      - name: Get packages
        run: flutter pub get 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Build web
        # asp-kurd.github.io ➔ "/" · ناڤەکێ دی ➔ "/<repo>/"
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          if [[ "$REPO" == *.github.io ]]; then BASE=/; else BASE="/$REPO/"; fi
          echo "base-href: $BASE"
          ID=${GITHUB_SHA::12}
          flutter build web --release --base-href "$BASE" --dart-define=BUILD_ID=$ID 2>&1 | tee -a build.log
          [ ${PIPESTATUS[0]} -eq 0 ] || exit 1
          python3 .github/scripts/post_build_web.py "$ID"

      - name: Report errors
        if: failure()
        run: python3 .github/scripts/report_errors.py build.log

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deploy
        uses: actions/deploy-pages@v4
