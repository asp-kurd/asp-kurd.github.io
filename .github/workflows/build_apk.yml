# دروستکرنا APK ب بێ کۆمپیوتەر — GitHub ب بێ پارە ئەپی بۆ تە build دکەت.
# ئەنجام: Actions ➔ دویماهیک run ➔ Artifacts ➔ ZimanPro-apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android platform
        run: flutter create . --platforms=android --project-name zimanpro --org com.zimanpro 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # flutter create تاقیکرنەکا نموونە (MyApp) زێدە دکەت کو د ئەپێ مە دا نینە
      - name: Patch Android config
        run: |
          rm -f test/widget_test.dart
          python3 .github/scripts/patch_android.py

      - name: Get packages
        run: flutter pub get 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Build release APK
        run: flutter build apk --release 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # خەلەتیان وەکی annotation نیشان ددەت دا Claude بشێت بخوینیت
      - name: Report errors
        if: failure()
        run: python3 .github/scripts/report_errors.py build.log

      - uses: actions/upload-artifact@v4
        with:
          name: ZimanPro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # 🍏 iPhone: ئەپا وێبێ ل سەر GitHub Pages ➔ https://groupkurdish-spec.github.io/Zimanpro/
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create web platform
        run: |
          flutter create . --platforms=web --project-name zimanpro --org com.zimanpro 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Patch web config
        run: |
          rm -f test/widget_test.dart
          python3 .github/scripts/patch_web.py

      - name: Get packages
        run: flutter pub get 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Build web
        run: flutter build web --release --base-href /Zimanpro/ 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Report errors
        if: failure()
        run: python3 .github/scripts/report_errors.py build.log

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deploy
        uses: actions/deploy-pages@v4
