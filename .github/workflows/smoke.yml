name: Backend smoke test
on:
  push:
    paths: [.github/workflows/smoke.yml, .github/scripts/smoke_backend.py]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q requests && python .github/scripts/smoke_backend.py | tee smoke.log; exit ${PIPESTATUS[0]}
      - if: always()
        run: python3 -c "import sys;[print('::notice title=smoke::'+l.strip()) for l in open('smoke.log')]"
